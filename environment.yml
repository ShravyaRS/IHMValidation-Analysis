
name: ihmvalidation
channels:
  - conda-forge
  - defaults
dependencies:
  # Python
  - python=3.10
  
  # Core Scientific Computing
  - numpy=1.26.2
  - scipy>=1.6.1
  - matplotlib>=3.4.0
  - pandas>=1.3.0
  - seaborn>=0.12.0
  
  # Visualization
  - bokeh>=2.4.2
  - selenium>=4.0.0
  
  # Data Processing
  - networkx>=2.6.2
  - biopython>=1.79
  
  # Development
  - pytest>=7.0.0
  - pytest-cov>=4.0.0
  - black>=22.0.0
  
  # PIP dependencies (not in conda)
  - pip
  - pip:
    - ihm==2.7
    - panel>=0.14.0

# Installation:
# conda env create -f environment.yml
# conda activate ihmvalidation
