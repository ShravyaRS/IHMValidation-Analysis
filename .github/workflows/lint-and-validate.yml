name: Lint and Validate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  structure-check:
    name: Repository Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Verify essential files exist
        run: |
          echo "Checking repository structure..."
          test -f README.md && echo "✓ README.md found"
          test -f CONTRIBUTING.md && echo "✓ CONTRIBUTING.md found"
          test -f LICENSE && echo "✓ LICENSE found"
          test -f install_complete.sh && echo "✓ install_complete.sh found"
          test -d IHMValidation && echo "✓ IHMValidation/ directory found"
          test -f IHMValidation/singularity/Singularity.def && echo "✓ Singularity.def found"
          echo "Repository structure verified successfully"
          
  documentation-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Check documentation files
        run: |
          echo "Checking documentation..."
          test -f TECHNICAL_DETAILS.md && echo "✓ TECHNICAL_DETAILS.md found"
          test -f BUILD_INSTRUCTIONS.md && echo "✓ BUILD_INSTRUCTIONS.md found"
          test -f ARCHITECTURE.md && echo "✓ ARCHITECTURE.md found"
          test -f RELEASE_NOTES_v1.0.0.md && echo "✓ RELEASE_NOTES_v1.0.0.md found"
          echo "Documentation verified successfully"
          
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Run ShellCheck on install script
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          echo "Running ShellCheck on install_complete.sh..."
          shellcheck install_complete.sh || echo "ShellCheck warnings found (non-critical)"
