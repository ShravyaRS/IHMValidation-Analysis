name: Lint and Validate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          ignore_paths: 'dev_history'
          
  python-lint:
    name: Python Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint
          
      - name: Lint with flake8
        run: |
          # Stop on syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=dev_history
          # Full linting (warnings)
          flake8 . --count --max-complexity=10 --max-line-length=127 --statistics --exclude=dev_history || true
          
  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Check documentation files exist
        run: |
          test -f README.md
          test -f TECHNICAL_DETAILS.md
          test -f BUILD_INSTRUCTIONS.md
          test -f ARCHITECTURE.md
          test -f CONTRIBUTING.md
          test -f install_complete.sh
          
      - name: Check for broken markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/markdown-link-check-config.json'
          
  structure:
    name: Repository Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Verify repository structure
        run: |
          # Check essential files in root
          test -f README.md
          test -f install_complete.sh
          test -f CONTRIBUTING.md
          
          # Check IHMValidation directory
          test -d IHMValidation
          test -f IHMValidation/singularity/Singularity.def
          test -f IHMValidation/patch_em_properly.py
          
          # Check dev_history exists
          test -d dev_history
          
          echo "Repository structure verified"
